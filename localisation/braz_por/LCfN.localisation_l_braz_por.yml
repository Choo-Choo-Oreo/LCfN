l_braz_por:
  LCfN_naval_count_loc: "[LCfN_naval_count_loc]/[?calculated_naval_cap|H0]"
  LCfN_naval_capacity_dynamic_modifier: "Capacidade Industrial Naval"
  LCfN_naval_label: "§HCapacidade Industrial Naval§!"
  LCfN_naval_desc: "Sua marinha é sustentada pela produção combinada de seus estaleiros e fábricas. Exceder este limite sobrecarrega sua logística marítima.\n\n[LCfN_load_type_loc]: [LCfN_naval_count_loc]/[?calculated_naval_cap|H0]\n\n§HDetalhamento Industrial:§!\n - Estaleiros Navais (x[?doc_weight_value|H1]): [?num_of_naval_factories|G0] (Valor: [?nav_dockyards|H0])\n - Fábricas Militares (x[?mil_weight_value|H1]): [?num_of_military_factories|G0] (Valor: [?mil_factories|H0])\n - Fábricas Civis (x[?civ_weight_value|H1]): [?num_of_civilian_factories|G0] (Valor: [?civ_factories|H0])\n\n[LCfN_mobilization_loc][LCfN_upkeep_loc]§HModificador Atual:§!\n [?LCfN_icd_ncd_value|=%+1] Produção de Estaleiro\n\n[LCfN_formula_loc]\n\n§GClique neste indicador para atualizar seu status logístico imediatamente.§!"

  LCfN_load_weighted: "§HDetalhamento da Frota:§!\n - $battle_cruiser$ (x[?bc_weight_value|H1]): [?num_ships_with_type@battle_cruiser] (Valor: [?t_bc|H0])\n - $battleship$ (x[?bb_weight_value|H1]): [?num_ships_with_type@battleship] (Valor: [?t_bb|H0])\n - $carrier$ (x[?cv_weight_value|H1]): [?num_ships_with_type@carrier] (Valor: [?t_cv|H0])\n - $destroyer$ (x[?dd_weight_value|H1]): [?num_ships_with_type@destroyer] (Valor: [?t_dd|H0])\n - $heavy_cruiser$ (x[?ca_weight_value|H1]): [?num_ships_with_type@heavy_cruiser] (Valor: [?t_ca|H0])\n - $light_cruiser$ (x[?cl_weight_value|H1]): [?num_ships_with_type@light_cruiser] (Valor: [?t_cl|H0])\n - $submarine$ (x[?ss_weight_value|H1]): [?num_ships_with_type@submarine] (Valor: [?t_ss|H0])\n - Diversos (x§H1.0§!): [?t_misc|0]\n\nCarga Total"
  LCfN_load_standard: "Carga Atual"

  LCfN_count_red: "§R[?current_ship_load|0]§!"
  LCfN_count_yellow: "§H[?current_ship_load|0]§!"
  LCfN_count_green: "§G[?current_ship_load|0]§!"

  LCfN_mob_breakdown_desc: "§HMobilização Industrial:§!\n - Bens de Consumo Atuais: [?current_cg_total|%Y]\n - Eficiência Logística: [?econ_efficiency_factor|%G]\n\n§LA alta demanda de consumo reduz a eficiência de sua logística naval. Mobilize sua economia para utilizar sua capacidade industrial total.§!\n\n"
  LCfN_mob_disabled_desc: ""

  LCfN_upkeep_desc: "§HManutenção de Infraestrutura:§!\n - Fator de Sobrecarga: [?infra_strain|H2]\n\n§LA escala massiva de seus estaleiros cria fricção logística. Seu bônus de eficiência é dividido por este fator para simular a manutenção da infraestrutura.§!\n\n"
  LCfN_upkeep_none: ""

  LCfN_linear_desc: "§LEste sistema usa uma curva Linear. A eficiência muda a uma taxa constante. Cada navio acima da capacidade adiciona a mesma penalidade, oferecendo uma experiência estável.§!"
  LCfN_quadratic_desc: "§LEste sistema usa uma curva Quadrática. As penalidades começam pequenas, mas aceleram rapidamente ao exceder a capacidade. Não há limite para a penalidade.§!"
  LCfN_sigmoid_desc: "§LEste sistema usa uma Sigmoide (Curva em S). Possui um início suave para pequenas extensões, mas escala bruscamente antes de atingir um teto industrial baseado em seus estaleiros.§!"
  LCfN_logarithmic_desc: "§LEste sistema usa uma curva Logarítmica. Navios iniciais sobre o limite têm alto impacto, mas o crescimento da penalidade desacelera significativamente conforme a frota cresce.§!"
  LCfN_step_desc: "§LEste sistema usa limiares fixos. Em vez de uma curva suave, a eficiência cai em 'degraus' súbitos em marcos específicos (ex: -1, -50 e -100 navios sobre o limite).§!"
  LCfN_hyperbolic_desc: "§LEste sistema usa uma 'Espiral da Morte' Hiperbólica. As penalidades são controláveis até atingir um limite crítico, onde a logística entra em colapso e a eficiência cai a zero.§!"

  LCfN_FORMULA_RULE: "Escalonamento Logístico Naval"
  LCfN_RULE_LINEAR: "Linear (Consistente)"
  LCfN_RULE_LINEAR_DESC:0 "§LEste sistema usa uma curva Linear. A eficiência muda a uma taxa constante. Cada navio acima da capacidade adiciona a mesma penalidade.\n\n§HExemplo (Cap C=240, Divisor K=100):§!\nDiff (D) = C - S\nFórmula: D / K\n\n§G40 Navios (D=200):§! 200 / 100 = §G+200%§!\n§G200 Navios (D=40):§! 40 / 100 = §G+40%§!\n§R280 Navios (D=-40):§! -40 / 100 = §R-40%§!§!"
  LCfN_RULE_QUADRATIC: "Quadrática (Escalonada)"
  LCfN_RULE_QUADRATIC_DESC:0 "§LEste sistema usa uma curva Quadrática. As penalidades aceleram rapidamente ao exceder a capacidade.\n\n§HExemplo (Cap C=240, Divisor K=5000):§!\nFórmula: (D * D) / K\n\n§G40 Navios (D=200):§! (200^2) / 5000 = §G+800%§!\n§G200 Navios (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280 Navios (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_SIGMOID: "Sigmoide (Equilibrada)"
  LCfN_RULE_SIGMOID_DESC:0 "§LEste sistema usa uma curva em S. Escala bruscamente no meio antes de atingir um teto industrial.\n\n§HExemplo (Cap C=240, Divisor K=5000):§!\nFórmula: (D * D) / K\nLimite: Estaleiros (20) * 0.2 = §YLimite de +/-400%§!\n\n§G40 Navios (D=200):§! (200^2) / 5000 = §G+400%§! (Limitado)\n§G200 Navios (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280 Navios (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_LOGARITHMIC: "Logarítmica (Impacto Inicial)"
  LCfN_RULE_LOGARITHMIC_DESC:0 "§LEste sistema usa uma curva Logarítmica. O impacto inicial é alto, mas o crescimento da penalidade diminui.\n\n§HExemplo (Cap C=240, Max M=5.0):§!\nFórmula: (M * D) / (D + 100)\n\n§G40 Navios (D=200):§! (5 * 200) / 300 = §G+333%§!\n§G200 Navios (D=40):§! (5 * 40) / 140 = §G+142%§!\n§R280 Navios (D=-40):§! (5 * -40) / 140 = §R-142%§!§!"
  LCfN_RULE_STEP: "Função Degrau (Marcos)"
  LCfN_RULE_STEP_DESC:0 "§LEste sistema usa limiares fixos. A eficiência cai em 'degraus' grandes em marcos específicos.\n\n§HExemplo (Cap C=240):§!\nLimiares: 1, 50, 100 navios acima\n\n§G40 Navios (Abaixo):§! Bônus Base §G+10%§!\n§G200 Navios (Abaixo):§! Bônus Base §G+10%§!\n§R280 Navios (40 Acima):§! Excede Limiar 1. Penalidade: §R-25%§!§!"
  LCfN_RULE_HYPERBOLIC: "Hiperbólica (Crítica)"
  LCfN_RULE_HYPERBOLIC_DESC:0 "§LEste sistema usa uma 'Espiral da Morte'. Penalidades tornam-se extremas ao aproximar-se de um limite crítico.\n\n§HExemplo (Cap C=240, Margem B=100):§!\nFórmula acima do Cap: 1 / (B - Qtd_Acima)\n\n§G40 Navios (Abaixo):§! Bônus Linear §G+200%§!\n§G200 Navios (Abaixo):§! Bônus Linear §G+40%§!\n§R280 Navios (40 Acima):§! 1 / (100 - 40) = §R-1.7%§! (Nota: Aos 95 acima, isso sobe para -20%)§!"

  LCfN_RULE_CLAMP: "Trava de Segurança Logística"
  LCfN_RULE_CLAMP_ON: "Ativado (Recomendado)"
  LCfN_RULE_CLAMP_ON_DESC: "Evita que penalidades de produção naval excedam -100%. Garante que frotas sobrecarregadas ainda possam produzir ou reparar navios lentamente."
  LCfN_RULE_CLAMP_OFF: "Desativado"
  LCfN_RULE_CLAMP_OFF_DESC: "Remove o piso de segurança. Extrema sobrecarga pode levar a penalidades superiores a -100%, paralisando a produção naval."
  LCfN_RULE_UNCLAMPED_PENALTY: "Modo Difícil: Foco em Sobre-Capacidade"
  LCfN_RULE_UNCLAMPED_PENALTY_DESC: "Remove bônus por estar abaixo da capacidade. Penalidades por exceder os limites são ilimitadas. Para evitar colapso total, nações recebem um fluxo mínimo de comboios baseado em estaleiros."

  LCfN_RULE_MOBILIZATION: "Impacto da Mobilização Econômica"
  LCfN_RULE_MOB_ON: "Ativado"
  LCfN_RULE_MOB_ON_DESC: "A eficiência naval está ligada ao uso de bens de consumo. Economias civis terão eficiência reduzida, enquanto Economias de Guerra oferecem suporte total."
  LCfN_RULE_MOB_OFF: "Desativado"
  LCfN_RULE_MOB_OFF_DESC: "A indústria fornece 100% de suporte logístico independentemente da lei econômica."

  LCfN_RULE_WEIGHTING: "Peso dos Navios"
  LCfN_RULE_WEIGHT_OFF: "Uniforme (1 Navio = 1 Cap)"
  LCfN_RULE_WEIGHT_OFF_DESC: "Cada navio consome exatamente 1 unidade de Capacidade Naval."
  LCfN_RULE_WEIGHT_ON: "Ponderado (Baseado no Casco)"
  LCfN_RULE_WEIGHT_ON_DESC: "Navios maiores consomem mais. Contratorpedeiros/Subs: 1, Cruzadores: 2, Capitais: 4+."

  LCfN_RULE_SCALING_LOGIC: "Lógica de Escalonamento"
  LCfN_RULE_DISTANCE: "Distância Absoluta"
  LCfN_RULE_DISTANCE_DESC: "Logística baseada no número bruto de navios acima ou abaixo do limite."
  LCfN_RULE_PERCENT: "Percentual de Saturação"
  LCfN_RULE_PERCENT_DESC: "Logística baseada na porcentagem da capacidade usada. Melhor para nações menores."

  LCfN_RULE_STRAIN: "Manutenção de Infraestrutura"
  LCfN_RULE_STRAIN_ON: "Ativado"
  LCfN_RULE_STRAIN_ON_DESC: "Grandes quantidades de estaleiros enfrentam retornos decrescentes devido à manutenção logística."
  LCfN_RULE_STRAIN_OFF: "Desativado"
  LCfN_RULE_STRAIN_OFF_DESC: "Estaleiros não geram sobrecarga logística base."
