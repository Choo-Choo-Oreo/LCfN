l_french:
  LCfN_naval_count_loc: "[LCfN_naval_count_loc]/[?calculated_naval_cap|H0]"
  LCfN_naval_capacity_dynamic_modifier: "Capacité Industrielle Navale"
  LCfN_naval_label: "§HCapacité Industrielle Navale§!"
  LCfN_naval_desc: "Votre marine est soutenue par la production combinée de vos chantiers navals et usines. Dépasser cette limite surcharge votre logistique maritime.\n\n[LCfN_load_type_loc]: [LCfN_naval_count_loc]/[?calculated_naval_cap|H0]\n\n§HDétail Industriel :§!\n - Chantiers Navals (x[?doc_weight_value|H1]) : [?num_of_naval_factories|G0] (Valeur : [?nav_dockyards|H0])\n - Usines Militaires (x[?mil_weight_value|H1]) : [?num_of_military_factories|G0] (Valeur : [?mil_factories|H0])\n - Usines Civiles (x[?civ_weight_value|H1]) : [?num_of_civilian_factories|G0] (Valeur : [?civ_factories|H0])\n\n[LCfN_mobilization_loc][LCfN_upkeep_loc]§HModificateur Actuel :§!\n [?LCfN_icd_ncd_value|=%+1] Production des Chantiers\n\n[LCfN_formula_loc]\n\n§GCliquez sur cet indicateur pour actualiser immédiatement votre statut logistique.§!"

  LCfN_load_weighted: "§HDétail de la Flotte :§!\n - $battle_cruiser$ (x[?bc_weight_value|H1]) : [?num_ships_with_type@battle_cruiser] (Valeur : [?t_bc|H0])\n - $battleship$ (x[?bb_weight_value|H1]) : [?num_ships_with_type@battleship] (Valeur : [?t_bb|H0])\n - $carrier$ (x[?cv_weight_value|H1]) : [?num_ships_with_type@carrier] (Valeur : [?t_cv|H0])\n - $destroyer$ (x[?dd_weight_value|H1]) : [?num_ships_with_type@destroyer] (Valeur : [?t_dd|H0])\n - $heavy_cruiser$ (x[?ca_weight_value|H1]) : [?num_ships_with_type@heavy_cruiser] (Valeur : [?t_ca|H0])\n - $light_cruiser$ (x[?cl_weight_value|H1]) : [?num_ships_with_type@light_cruiser] (Valeur : [?t_cl|H0])\n - $submarine$ (x[?ss_weight_value|H1]) : [?num_ships_with_type@submarine] (Valeur : [?t_ss|H0])\n - Divers (x§H1.0§!) : [?t_misc|0]\n\nCharge Totale"
  LCfN_load_standard: "Charge Actuelle"

  LCfN_count_red: "§R[?current_ship_load|0]§!"
  LCfN_count_yellow: "§H[?current_ship_load|0]§!"
  LCfN_count_green: "§G[?current_ship_load|0]§!"

  LCfN_mob_breakdown_desc: "§HMobilisation Industrielle :§!\n - Biens de Consommation Actuels : [?current_cg_total|%Y]\n - Efficacité Logistique : [?econ_efficiency_factor|%G]\n\n§LUne forte demande de consommation réduit l'efficacité de votre logistique navale. Mobilisez votre économie pour utiliser votre pleine capacité industrielle.§!\n\n"
  LCfN_mob_disabled_desc: ""

  LCfN_upkeep_desc: "§HEntretien de l'Infrastructure :§!\n - Facteur de Tension : [?infra_strain|H2]\n\n§L'échelle massive de vos chantiers navals crée une friction logistique. Votre bonus d'efficacité est divisé par ce facteur pour simuler l'entretien.§!\n\n"
  LCfN_upkeep_none: ""

  LCfN_linear_desc: "§LUtilise une courbe Linéaire. L'efficacité change à un taux constant. Chaque navire au-delà du plafond ajoute la même pénalité.§!"
  LCfN_quadratic_desc: "§LUtilise une courbe Quadratique. Les pénalités commencent doucement mais s'accélèrent rapidement. Pas de limite au malus.§!"
  LCfN_sigmoid_desc: "§LUtilise une Sigmoïde (Courbe en S). Début souple, mais s'accentue brusquement avant de frapper un plafond industriel basé sur vos chantiers.§!"
  LCfN_logarithmic_desc: "§LUtilise une courbe Logarithmique. Les premiers navires en surplus ont un fort impact, mais la croissance de la pénalité ralentit ensuite.§!"
  LCfN_step_desc: "§LUtilise des seuils fixes. L'efficacité chute brutalement par 'paliers' lors de jalons spécifiques (ex: -1, -50, -100 navires).§!"
  LCfN_hyperbolic_desc: "§LUtilise une 'Spirale de la mort' Hyperbolique. Malus gérables jusqu'à un seuil critique où la logistique s'effondre totalement.§!"

  LCfN_FORMULA_RULE: "Échelonnement Logistique Naval"
  LCfN_RULE_LINEAR: "Linéaire (Constant)"
  LCfN_RULE_LINEAR_DESC: "§LUtilise une courbe Linéaire. L'efficacité change à un taux constant.\n\n§HExemple (Cap C=240, Diviseur K=100) :§!\nDiff (D) = C - S\nFormule : D / K\n\n§G40 Navires (D=200) :§! 200 / 100 = §G+200%§!\n§G200 Navires (D=40) :§! 40 / 100 = §G+40%§!\n§R280 Navires (D=-40) :§! -40 / 100 = §R-40%§!§!"
  LCfN_RULE_QUADRATIC: "Quadratique (Croissant)"
  LCfN_RULE_QUADRATIC_DESC: "§LUtilise une courbe Quadratique. Les pénalités s'accélèrent rapidement après le dépassement du plafond.\n\n§HExemple (Cap C=240, Diviseur K=5000) :§!\nFormule : (D * D) / K\n\n§G40 Navires (D=200) :§! (200^2) / 5000 = §G+800%§!\n§G200 Navires (D=40) :§! (40^2) / 5000 = §G+32%§!\n§R280 Navires (D=-40) :§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_SIGMOID: "Sigmoïde (Équilibré)"
  LCfN_RULE_SIGMOID_DESC: "§LUtilise une courbe en S. S'accentue brusquement au milieu avant d'atteindre un plafond industriel.\n\n§HExemple (Cap C=240, Diviseur K=5000) :§!\nFormule : (D * D) / K\nLimite : Chantiers (20) * 0.2 = §YLimite +/-400%§!\n\n§G40 Navires (D=200) :§! (200^2) / 5000 = §G+400%§! (Plantonné)\n§G200 Navires (D=40) :§! (40^2) / 5000 = §G+32%§!\n§R280 Navires (D=-40) :§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_LOGARITHMIC: "Logarithmique (Impact Précocé)"
  LCfN_RULE_LOGARITHMIC_DESC: "§LUtilise une courbe Logarithmique. Impact initial élevé, mais la croissance du malus ralentit.\n\n§HExemple (Cap C=240, Max M=5.0) :§!\nFormule : (M * D) / (D + 100)\n\n§G40 Navires (D=200) :§! (5 * 200) / 300 = §G+333%§!\n§G200 Navires (D=40) :§! (5 * 40) / 140 = §G+142%§!\n§R280 Navires (D=-40) :§! (5 * -40) / 140 = §R-142%§!§!"
  LCfN_RULE_STEP: "Fonction de Palier (Jalons)"
  LCfN_RULE_STEP_DESC: "§LUtilise des seuils fixes. L'efficacité chute brutalement lors de franchissements de jalons.\n\n§HExemple (Cap C=240) :§!\nSeuils : 1, 50, 100 navires en surplus\n\n§G40 Navires (Sous cap) :§! Bonus de Base §G+10%§!\n§G200 Navires (Sous cap) :§! Bonus de Base §G+10%§!\n§R280 Navires (40 en surplus) :§! Seuil 1 franchi. Pénalité : §R-25%§!§!"
  LCfN_RULE_HYPERBOLIC: "Hyperbolique (Critique)"
  LCfN_RULE_HYPERBOLIC_DESC: "§LUtilise une 'Spirale de la mort'. Les pénalités deviennent extrêmes à l'approche d'un point de rupture.\n\n§HExemple (Cap C=240, Zone B=100) :§!\nFormule au-delà du Cap : 1 / (B - Surplus)\n\n§G40 Navires (Sous cap) :§! Bonus Linéaire §G+200%§!\n§G200 Navires (Sous cap) :§! Bonus Linéaire §G+40%§!\n§R280 Navires (40 en surplus) :§! 1 / (100 - 40) = §R-1.7%§! (Note : à 95 en surplus, chute à -20%)§!"

  LCfN_RULE_CLAMP: "Verrou de Sécurité Logistique"
  LCfN_RULE_CLAMP_ON: "Activé (Recommandé)"
  LCfN_RULE_CLAMP_ON_DESC: "Empêche les pénalités de production de dépasser -100%. Assure que même une flotte géante peut encore réparer ses navires, bien que très lentement."
  LCfN_RULE_CLAMP_OFF: "Désactivé"
  LCfN_RULE_CLAMP_OFF_DESC: "Supprime le plancher de sécurité. Un surplus extrême peut stopper net toute production navale."
  LCfN_RULE_UNCLAMPED_PENALTY: "Mode Difficile : Focus Surcapacité"
  LCfN_RULE_UNCLAMPED_PENALTY_DESC: "Supprime les bonus pour les flottes sous le plafond. Les pénalités sont désormais illimitées."

  LCfN_RULE_MOBILIZATION: "Impact de la Mobilisation Économique"
  LCfN_RULE_MOB_ON: "Activé"
  LCfN_RULE_MOB_ON_DESC: "L'efficacité navale dépend des biens de consommation. L'Économie Civile est moins efficace que l'Économie de Guerre."
  LCfN_RULE_MOB_OFF: "Désactivé"
  LCfN_RULE_MOB_OFF_DESC: "L'industrie offre 100% du support logistique peu importe la loi économique."

  LCfN_RULE_WEIGHTING: "Pondération des Navires"
  LCfN_RULE_WEIGHT_OFF: "Uniforme (1 Navire = 1 Cap)"
  LCfN_RULE_WEIGHT_OFF_DESC: "Chaque navire consomme exactement 1 unité de capacité navale."
  LCfN_RULE_WEIGHT_ON: "Pondéré (Selon la Coque)"
  LCfN_RULE_WEIGHT_ON_DESC: "Les gros navires consomment plus. Destroyers : 1, Croiseurs : 2, Capital Ships : 4+."

  LCfN_RULE_SCALING_LOGIC: "Calcul de l'Échelle"
  LCfN_RULE_DISTANCE: "Distance Absolue"
  LCfN_RULE_DISTANCE_DESC: "Basé sur le nombre brut de navires au-delà ou en deçà du cap."
  LCfN_RULE_PERCENT: "Pourcentage de Saturation"
  LCfN_RULE_PERCENT_DESC: "Basé sur le pourcentage de capacité utilisé. Préférable pour les petites nations."

  LCfN_RULE_STRAIN: "Entretien d'Infrastructure"
  LCfN_RULE_STRAIN_ON: "Activé"
  LCfN_RULE_STRAIN_ON_DESC: "L'accumulation de chantiers navals subit des rendements décroissants à cause de la gestion logistique."
  LCfN_RULE_STRAIN_OFF: "Désactivé"
  LCfN_RULE_STRAIN_OFF_DESC: "Les chantiers navals ne créent pas de tension logistique de base."
