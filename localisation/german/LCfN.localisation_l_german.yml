l_german:
  LCfN_naval_count_loc: "[LCfN_naval_count_loc]/[?calculated_naval_cap|H0]"
  LCfN_naval_capacity_dynamic_modifier: "Marine-Industriekapazität"
  LCfN_naval_label: "§HMarine-Industriekapazität§!"
  LCfN_naval_desc: "Ihre Marine wird durch die kombinierte Leistung Ihrer Werften und Fabriken unterstützt. Das Überschreiten dieses Limits belastet Ihre maritime Logistik.\n\n[LCfN_load_type_loc]: [LCfN_naval_count_loc]/[?calculated_naval_cap|H0]\n\n§HIndustrielle Aufschlüsselung:§!\n - Marinewerften (x[?doc_weight_value|H1]): [?num_of_naval_factories|G0] (Wert: [?nav_dockyards|H0])\n - Militärfabriken (x[?mil_weight_value|H1]): [?num_of_military_factories|G0] (Wert: [?mil_factories|H0])\n - Zivilfabriken (x[?civ_weight_value|H1]): [?num_of_civilian_factories|G0] (Wert: [?civ_factories|H0])\n\n[LCfN_mobilization_loc][LCfN_upkeep_loc]§HAktueller Modifikator:§!\n [?LCfN_icd_ncd_value|=%+1] Werft-Ausstoß\n\n[LCfN_formula_loc]\n\n§GKlicken Sie auf diese Anzeige, um Ihren Logistikstatus sofort zu aktualisieren.§!"

  LCfN_load_weighted: "§HFlotten-Aufschlüsselung:§!\n - $battle_cruiser$ (x[?bc_weight_value|H1]): [?num_ships_with_type@battle_cruiser|G0] (Wert: [?t_bc|H0])\n - $battleship$ (x[?bb_weight_value|H1]): [?num_ships_with_type@battleship|G0] (Wert: [?t_bb|H0])\n - $carrier$ (x[?cv_weight_value|H1]): [?num_ships_with_type@carrier|G0] (Wert: [?t_cv|H0])\n - $destroyer$ (x[?dd_weight_value|H1]): [?num_ships_with_type@destroyer|G0] (Wert: [?t_dd|H0])\n - $heavy_cruiser$ (x[?ca_weight_value|H1]): [?num_ships_with_type@heavy_cruiser|G0] (Wert: [?t_ca|H0])\n - $light_cruiser$ (x[?cl_weight_value|H1]): [?num_ships_with_type@light_cruiser|G0] (Wert: [?t_cl|H0])\n - $submarine$ (x[?ss_weight_value|H1]): [?num_ships_with_type@submarine|G0] (Wert: [?t_ss|H0])\n - Verschiedenes (x§H1.0§!): [?t_misc|G0]\n\nGesamtlast"
  LCfN_load_standard: "Aktuelle Last"

  LCfN_count_red: "§R[?current_ship_load|0]§!"
  LCfN_count_yellow: "§H[?current_ship_load|0]§!"
  LCfN_count_green: "§G[?current_ship_load|0]§!"

  LCfN_mob_breakdown_desc: "§HIndustrielle Mobilisierung:§!\n - Aktuelle Konsumgüter: [?current_cg_total|%Y]\n - Logistische Effizienz: [?econ_efficiency_factor|%G]\n\n§LHohe Nachfrage nach Konsumgütern verringert die Effizienz Ihrer Marinelogistik. Mobilisieren Sie Ihre Wirtschaft, um Ihre volle Industriekapazität zu nutzen.§!\n\n"
  LCfN_mob_disabled_desc: ""

  LCfN_upkeep_desc: "§HInfrastruktur-Instandhaltung:§!\n - Belastungsfaktor: [?infra_strain|H2]\n\n§LDie schiere Größe Ihrer Werften verursacht logistische Reibung. Ihr Effizienzbonus wird durch diesen Faktor geteilt, um Wartungskosten zu simulieren.§!\n\n"
  LCfN_upkeep_none: ""

  LCfN_linear_desc: "§LDieses System verwendet eine lineare Kurve. Die Effizienz ändert sich mit einer konstanten Rate. Jedes Schiff über dem Limit verursacht die gleiche Strafe.§!"
  LCfN_quadratic_desc: "§LDieses System verwendet eine quadratische Kurve. Die Strafen beginnen klein, beschleunigen sich aber schnell beim Überschreiten des Limits.§!"
  LCfN_sigmoid_desc: "§LDieses System verwendet eine Sigmoid-Kurve (S-Kurve). Sanfter Start bei geringer Überdehnung, skaliert aber stark in der Mitte.§!"
  LCfN_logarithmic_desc: "§LDieses System verwendet eine logarithmische Kurve. Erste Schiffe über dem Limit haben eine hohe Auswirkung, aber das Strafwachstum verlangsamt sich später.§!"
  LCfN_step_desc: "§LDieses System verwendet feste Schwellenwerte. Die Effizienz sinkt in plötzlichen 'Stufen' bei bestimmten Meilensteinen.§!"
  LCfN_hyperbolic_desc: "§LDieses System verwendet eine hyperbolische 'Todesspirale'. Strafen eskalieren extrem, wenn man sich einem kritischen Punkt nähert.§!"

  LCfN_FORMULA_RULE: "Marinelogistik-Skalierung"
  LCfN_RULE_LINEAR: "Linear (Beständig)"
  LCfN_RULE_LINEAR_DESC: "§LDieses System verwendet eine lineare Kurve. Die Effizienz ändert sich mit einer konstanten Rate.\n\n§HBeispiel (Limit C=240, Divisor K=100):§!\nDiff (D) = C - S\nFormel: D / K\n\n§G40 Schiffe (D=200):§! 200 / 100 = §G+200%§!\n§G200 Schiffe (D=40):§! 40 / 100 = §G+40%§!\n§R280 Schiffe (D=-40):§! -40 / 100 = §R-40%§!§!"
  LCfN_RULE_QUADRATIC: "Quadratisch (Skalierend)"
  LCfN_RULE_QUADRATIC_DESC: "§LDieses System verwendet eine quadratische Kurve. Strafen beschleunigen sich beim Überschreiten des Limits schnell.\n\n§HBeispiel (Limit C=240, Divisor K=5000):§!\nFormel: (D * D) / K\n\n§G40 Schiffe (D=200):§! (200^2) / 5000 = §G+800%§!\n§G200 Schiffe (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280 Schiffe (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_SIGMOID: "Sigmoid (Ausbalanciert)"
  LCfN_RULE_SIGMOID_DESC: "§LDieses System verwendet eine S-Kurve. Skaliert stark in der Mitte, bevor ein industrielles Limit erreicht wird.\n\n§HBeispiel (Limit C=240, Divisor K=5000):§!\nFormel: (D * D) / K\nLimit: Werften (20) * 0.2 = §Y+/-400% Limit§!\n\n§G40 Schiffe (D=200):§! (200^2) / 5000 = §G+400%§! (Gedeckelt)\n§G200 Schiffe (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280 Schiffe (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_LOGARITHMIC: "Logarithmisch (Frühe Auswirkung)"
  LCfN_RULE_LOGARITHMIC_DESC: "§LDieses System verwendet eine logarithmische Kurve. Hohe Auswirkung zu Beginn, aber das Strafwachstum nimmt ab.\n\n§HBeispiel (Limit C=240, Max M=5.0):§!\nFormel: (M * D) / (D + 100)\n\n§G40 Schiffe (D=200):§! (5 * 200) / 300 = §G+333%§!\n§G200 Schiffe (D=40):§! (5 * 40) / 140 = §G+142%§!\n§R280 Schiffe (D=-40):§! (5 * -40) / 140 = §R-142%§!§!"
  LCfN_RULE_STEP: "Stufenfunktion (Meilensteine)"
  LCfN_RULE_STEP_DESC: "§LDieses System verwendet feste Schwellenwerte. Die Effizienz sinkt in großen Stufen bei bestimmten Meilensteinen.\n\n§HBeispiel (Limit C=240):§!\nSchwellenwerte: 1, 50, 100 Schiffe darüber\n\n§G40 Schiffe (Darunter):§! Basis-Bonus §G+10%§!\n§G200 Schiffe (Darunter):§! Basis-Bonus §G+10%§!\n§R280 Schiffe (40 darüber):§! Schwellenwert 1 erreicht. Strafe: §R-25%§!§!"
  LCfN_RULE_HYPERBOLIC: "Hyperbolisch (Kritisch)"
  LCfN_RULE_HYPERBOLIC_DESC: "§LDieses System verwendet eine 'Todesspirale'. Strafen werden extrem, sobald man sich einem kritischen Puffer nähert.\n\n§HBeispiel (Limit C=240, Puffer B=100):§!\nFormel über Limit: 1 / (B - Menge_Über_Limit)\n\n§G40 Schiffe (Darunter):§! Linearer Bonus §G+200%§!\n§G200 Schiffe (Darunter):§! Linearer Bonus §G+40%§!\n§R280 Schiffe (40 darüber):§! 1 / (100 - 40) = §R-1.7%§! (Hinweis: Bei 95 darüber steigt dies auf -20%)§!"

  LCfN_RULE_CLAMP: "Logistik-Sicherheitsklemme"
  LCfN_RULE_CLAMP_ON: "Aktiviert (Empfohlen)"
  LCfN_RULE_CLAMP_ON_DESC: "Verhindert, dass die Produktionsstrafen -100% überschreiten. So kann eine Flotte immer noch repariert werden, wenn auch sehr langsam."
  LCfN_RULE_CLAMP_OFF: "Deaktiviert"
  LCfN_RULE_CLAMP_OFF_DESC: "Entfernt die Sicherheitsuntergrenze. Extreme Überlastung kann die gesamte Marineproduktion stoppen."
  LCfN_RULE_UNCLAMPED_PENALTY: "Schwerer Modus: Überkapazitäts-Fokus"
  LCfN_RULE_UNCLAMPED_PENALTY_DESC: "Entfernt alle Boni für Flotten unter dem Limit. Strafen sind nun unbegrenzt und können massive Ausmaße annehmen."

  LCfN_RULE_MOBILIZATION: "Einfluss der wirtschaftlichen Mobilisierung"
  LCfN_RULE_MOB_ON: "Aktiviert"
  LCfN_RULE_MOB_ON_DESC: "Marinelogistik ist an Konsumgüter gebunden. Zivilwirtschaften haben eine reduzierte Effizienz, während Kriegswirtschaften volle Unterstützung bieten."
  LCfN_RULE_MOB_OFF: "Deaktiviert"
  LCfN_RULE_MOB_OFF_DESC: "Die Industrie bietet 100% Unterstützung unabhängig von Wirtschaftsgesetzen."

  LCfN_RULE_WEIGHTING: "Schiffsgewichtung"
  LCfN_RULE_WEIGHT_OFF: "Einheitlich (1 Schiff = 1 Cap)"
  LCfN_RULE_WEIGHT_OFF_DESC: "Jedes Schiff verbraucht genau 1 Einheit Marinekapazität."
  LCfN_RULE_WEIGHT_ON: "Gewichtet (Basierend auf Rumpf)"
  LCfN_RULE_WEIGHT_ON_DESC: "Größere Schiffe verbrauchen mehr Kapazität. Zerstörer/U-Boote: 1, Kreuzer: 2, Großkampfschiffe: 4+."

  LCfN_RULE_SCALING_LOGIC: "Skalierungs-Logik"
  LCfN_RULE_DISTANCE: "Absoluter Abstand"
  LCfN_RULE_DISTANCE_DESC: "Logistik basiert auf der rohen Anzahl der Schiffe über oder unter dem Limit."
  LCfN_RULE_PERCENT: "Sättigungsprozentsatz"
  LCfN_RULE_PERCENT_DESC: "Logistik basiert auf dem Prozentsatz der genutzten Kapazität. Besser für kleinere Nationen."

  LCfN_RULE_STRAIN: "Infrastruktur-Instandhaltung"
  LCfN_RULE_STRAIN_ON: "Aktiviert"
  LCfN_RULE_STRAIN_ON_DESC: "Eine große Anzahl von Werften führt zu abnehmenden Erträgen durch logistische Belastung."
  LCfN_RULE_STRAIN_OFF: "Deaktiviert"
  LCfN_RULE_STRAIN_OFF_DESC: "Werften erzeugen keine grundlegende logistische Belastung."
