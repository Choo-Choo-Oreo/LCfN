l_japanese:
  LCfN_naval_count_loc: "[LCfN_naval_count_loc]/[?calculated_naval_cap|H0]"
  LCfN_naval_capacity_dynamic_modifier: "海軍工業能力"
  LCfN_naval_label: "§H海軍工業能力§!"
  LCfN_naval_desc: "海軍は造船所と工場の合計出力によって支えられています。この制限を超えると、海上兵站に負荷がかかります。\n\n[LCfN_load_type_loc]: [LCfN_naval_count_loc]/[?calculated_naval_cap|H0]\n\n§H工業内訳:§!\n - 海軍造船所 (x[?doc_weight_value|H1]): [?num_of_naval_factories|G0] (値: [?nav_dockyards|H0])\n - 軍需工場 (x[?mil_weight_value|H1]): [?num_of_military_factories|G0] (値: [?mil_factories|H0])\n - 民需工場 (x[?civ_weight_value|H1]): [?num_of_civilian_factories|G0] (値: [?civ_factories|H0])\n\n[LCfN_mobilization_loc][LCfN_upkeep_loc]§H現在の補正:§!\n [?LCfN_icd_ncd_value|=%+1] 造船所出力\n\n[LCfN_formula_loc]\n\n§Gこのインジケーターをクリックすると、兵站ステータスを即座に更新します。§!"

  LCfN_load_weighted: "§H艦隊内訳:§!\n - $battle_cruiser$ (x[?bc_weight_value|H1]): [?num_ships_with_type@battle_cruiser] (値: [?t_bc|H0])\n - $battleship$ (x[?bb_weight_value|H1]): [?num_ships_with_type@battleship] (値: [?t_bb|H0])\n - $carrier$ (x[?cv_weight_value|H1]): [?num_ships_with_type@carrier] (値: [?t_cv|H0])\n - $destroyer$ (x[?dd_weight_value|H1]): [?num_ships_with_type@destroyer] (値: [?t_dd|H0])\n - $heavy_cruiser$ (x[?ca_weight_value|H1]): [?num_ships_with_type@heavy_cruiser] (値: [?t_ca|H0])\n - $light_cruiser$ (x[?cl_weight_value|H1]): [?num_ships_with_type@light_cruiser] (値: [?t_cl|H0])\n - $submarine$ (x[?ss_weight_value|H1]): [?num_ships_with_type@submarine] (値: [?t_ss|H0])\n - その他 (x§H1.0§!): [?t_misc|0]\n\n総負荷"
  LCfN_load_standard: "現在の負荷"

  LCfN_count_red: "§R[?current_ship_load|0]§!"
  LCfN_count_yellow: "§H[?current_ship_load|0]§!"
  LCfN_count_green: "§G[?current_ship_load|0]§!"

  LCfN_mob_breakdown_desc: "§H工業動員:§!\n - 現在の消費財: [?current_cg_total|%Y]\n - 兵站効率: [?econ_efficiency_factor|%G]\n\n§L消費財需要が高いと、海軍兵站の効率が低下します。経済を動員して工業能力を最大限に活用してください。§!\n\n"
  LCfN_mob_disabled_desc: ""

  LCfN_upkeep_desc: "§Hインフラ維持費:§!\n - 負荷係数: [?infra_strain|H2]\n\n§L造船所の規模が大きすぎると、兵站上の摩擦が生じます。効率ボーナスはこの係数で除算され、インフラ維持をシミュレートします。§!\n\n"
  LCfN_upkeep_none: ""

  LCfN_linear_desc: "§Lこのシステムは線形曲線を使用します。効率は一定の割合で変化します。容量を超えたすべての船が同じペナルティを加え、予測可能で安定した体験を提供します。§!"
  LCfN_quadratic_desc: "§Lこのシステムは二次曲線を使用します。ペナルティは最初は小さいですが、容量を超えると急速に加速します。ペナルティの上限はありません。§!"
  LCfN_sigmoid_desc: "§Lこのシステムはシグモイド(S字)曲線を使用します。軽微な過拡張には「ソフト」に始まり、中間で急激にスケールした後、造船所数に基づいた工業的天井に達します。§!"
  LCfN_logarithmic_desc: "§Lこのシステムは対数曲線を使用します。初期の超過は効率に大きな影響を与えますが、艦隊が成長し続けるにつれてペナルティの増加は鈍化します。§!"
  LCfN_step_desc: "§Lこのシステムは固定の閾値を使用します。滑らかな曲線ではなく、特定の節目で効率が突然大きく低下します。§!"
  LCfN_hyperbolic_desc: "§Lこのシステムは双曲線の「死のスパイラル」を使用します。クリティカルなバッファに近づくまでペナルティは管理可能ですが、それを超えると兵站が完全に崩壊します。§!"

  LCfN_FORMULA_RULE: "海軍兵站スケーリング"
  LCfN_RULE_LINEAR: "線形（一貫）"
  LCfN_RULE_LINEAR_DESC: "§L線形曲線を使用します。効率は一定の割合で変化し、容量超過1隻あたりのペナルティは一定です。\n\n§H例 (容量 C=240, 除数 K=100):§!\n差 (D) = C - S\n公式: D / K\n\n§G40隻 (D=200):§! 200 / 100 = §G+200%§!\n§G200隻 (D=40):§! 40 / 100 = §G+40%§!\n§R280隻 (D=-40):§! -40 / 100 = §R-40%§!§!"
  LCfN_RULE_QUADRATIC: "二次（加速）"
  LCfN_RULE_QUADRATIC_DESC: "§L二次曲線を使用します。容量を超えるとペナルティが急速に加速します。\n\n§H例 (容量 C=240, 除数 K=5000):§!\n公式: (D * D) / K\n\n§G40隻 (D=200):§! (200^2) / 5000 = §G+800%§!\n§G200隻 (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280隻 (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_SIGMOID: "シグモイド（均衡）"
  LCfN_RULE_SIGMOID_DESC: "§LS字曲線を使用します。ソフトな開始、中間の急激な上昇、造船所数による工業的制限が特徴です。\n\n§H例 (容量 C=240, 除数 K=5000):§!\n公式: (D * D) / K\n上限: 造船所 (20) * 0.2 = §Y+/-400% 制限§!\n\n§G40隻 (D=200):§! (200^2) / 5000 = §G+400%§! (上限)\n§G200隻 (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280隻 (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_LOGARITHMIC: "対数（初期影響）"
  LCfN_RULE_LOGARITHMIC_DESC: "§L対数曲線を使用します。初期の超過は影響が大きいですが、後の増加は緩やかになります。\n\n§H例 (容量 C=240, 最大 M=5.0):§!\n公式: (M * D) / (D + 100)\n\n§G40隻 (D=200):§! (5 * 200) / 300 = §G+333%§!\n§G200隻 (D=40):§! (5 * 40) / 140 = §G+142%§!\n§R280隻 (D=-40):§! (5 * -40) / 140 = §R-142%§!§!"
  LCfN_RULE_STEP: "段階関数（節目）"
  LCfN_RULE_STEP_DESC: "§L固定の閾値を使用します。滑らかな曲線ではなく、特定の節目で段階的に効率が低下します。\n\n§H例 (容量 C=240):§!\n閾値: 超過 1, 50, 100 隻\n\n§G40隻 (未満):§! 基本ボーナス §G+10%§!\n§G200隻 (未満):§! 基本ボーナス §G+10%§!\n§R280隻 (40超過):§! 閾値1を超過。ペナルティ: §R-25%§!§!"
  LCfN_RULE_HYPERBOLIC: "双曲線（致命的）"
  LCfN_RULE_HYPERBOLIC_DESC: "§L「死のスパイラル」を使用します。限界点に達すると兵站が崩壊し、効率がゼロに向かって急落します。\n\n§H例 (容量 C=240, バッファ B=100):§!\n超過時の公式: 1 / (B - Over_Amount)\n\n§G40隻 (未満):§! 線形ボーナス §G+200%§!\n§G200隻 (未満):§! 線形ボーナス §G+40%§!\n§R280隻 (40超過):§! 1 / (100 - 40) = §R-1.7%§! (95隻超過で -20% に急騰)§!"

  LCfN_RULE_CLAMP: "兵站安全クランプ"
  LCfN_RULE_CLAMP_ON: "有効（推奨）"
  LCfN_RULE_CLAMP_ON_DESC: "海軍生産ペナルティが-100%を超えないようにします。これにより、極端に拡張した艦隊でも、非常に低速ながら建造や修理が可能になります。"
  LCfN_RULE_CLAMP_OFF: "無効"
  LCfN_RULE_CLAMP_OFF_DESC: "安全床を撤去します。極端な過拡張は-100%を遥かに超えるペナルティを招き、海軍工業を事実上停止させます。"
  LCfN_RULE_UNCLAMPED_PENALTY: "ハードモード: 容量超過重視"
  LCfN_RULE_UNCLAMPED_PENALTY_DESC: "容量未満のボーナスをすべて削除します。ペナルティは無制限になり、経済崩壊を防ぐために最小限の輸送船のみが供給されます。"

  LCfN_RULE_MOBILIZATION: "経済動員の影響"
  LCfN_RULE_MOB_ON: "有効"
  LCfN_RULE_MOB_ON_DESC: "海軍兵站効率が消費財の使用量と連動します。民間経済では効率が低下し、総動員体制では最大の支援が得られます。"
  LCfN_RULE_MOB_OFF: "無効"
  LCfN_RULE_MOB_OFF_DESC: "経済法や消費財に関係なく、工業は100%の兵站支援を提供します。"

  LCfN_RULE_WEIGHTING: "艦船の重み付け"
  LCfN_RULE_WEIGHT_OFF: "一律 (1隻 = 1容量)"
  LCfN_RULE_WEIGHT_OFF_DESC: "サイズに関係なく、すべての船が正確に1ユニットの海軍容量を消費します。"
  LCfN_RULE_WEIGHT_ON: "重み付け (船体ベース)"
  LCfN_RULE_WEIGHT_ON_DESC: "大型艦ほど多くの容量を消費します。駆逐艦/潜水艦: 1、巡洋艦: 2、主力艦: 4+。"

  LCfN_RULE_SCALING_LOGIC: "スケーリング計算"
  LCfN_RULE_DISTANCE: "絶対距離"
  LCfN_RULE_DISTANCE_DESC: "容量に対する超過・不足の「隻数」に基づいて兵站を計算します。"
  LCfN_RULE_PERCENT: "飽和度（パーセント）"
  LCfN_RULE_PERCENT_DESC: "容量の使用「割合」に基づいて計算します。小国に適しています。"

  LCfN_RULE_STRAIN: "インフラ維持費"
  LCfN_RULE_STRAIN_ON: "有効"
  LCfN_RULE_STRAIN_ON_DESC: "多数の造船所を持つと、維持の複雑さから収穫逓減が発生します。"
  LCfN_RULE_STRAIN_OFF: "無効"
  LCfN_RULE_STRAIN_OFF_DESC: "造船所による兵站の基礎負荷は発生しません。"
