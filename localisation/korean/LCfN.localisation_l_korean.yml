l_korean:
  LCfN_naval_count_loc: "[LCfN_naval_count_loc]/[?calculated_naval_cap|H0]"
  LCfN_naval_capacity_dynamic_modifier: "해군 공업 역량"
  LCfN_naval_label: "§H해군 공업 역량§!"
  LCfN_naval_desc: "귀하의 해군은 조선소와 공장의 결합된 출력에 의해 지원됩니다. 이 한도를 초과하면 해상 물류에 과부하가 걸립니다.\n\n[LCfN_load_type_loc]: [LCfN_naval_count_loc]/[?calculated_naval_cap|H0]\n\n§H산업 세부 정보:§!\n - 해군 조선소 (x[?doc_weight_value|H1]): [?num_of_naval_factories|G0] (가치: [?nav_dockyards|H0])\n - 군수 공장 (x[?mil_weight_value|H1]): [?num_of_military_factories|G0] (가치: [?mil_factories|H0])\n - 민간 공장 (x[?civ_weight_value|H1]): [?num_of_civilian_factories|G0] (가치: [?civ_factories|H0])\n\n[LCfN_mobilization_loc][LCfN_upkeep_loc]§H현재 수정치:§!\n [?LCfN_icd_ncd_value|=%+1] 조선소 출력\n\n[LCfN_formula_loc]\n\n§G이 표시기를 클릭하면 물류 상태를 즉시 갱신합니다.§!"

  LCfN_load_weighted: "§H함대 세부 정보:§!\n - $battle_cruiser$ (x[?bc_weight_value|H1]): [?num_ships_with_type@battle_cruiser] (가치: [?t_bc|H0])\n - $battleship$ (x[?bb_weight_value|H1]): [?num_ships_with_type@battleship] (가치: [?t_bb|H0])\n - $carrier$ (x[?cv_weight_value|H1]): [?num_ships_with_type@carrier] (가치: [?t_cv|H0])\n - $destroyer$ (x[?dd_weight_value|H1]): [?num_ships_with_type@destroyer] (가치: [?t_dd|H0])\n - $heavy_cruiser$ (x[?ca_weight_value|H1]): [?num_ships_with_type@heavy_cruiser] (가치: [?t_ca|H0])\n - $light_cruiser$ (x[?cl_weight_value|H1]): [?num_ships_with_type@light_cruiser] (가치: [?t_cl|H0])\n - $submarine$ (x[?ss_weight_value|H1]): [?num_ships_with_type@submarine] (가치: [?t_ss|H0])\n - 기타 (x§H1.0§!): [?t_misc|0]\n\n총 부하"
  LCfN_load_standard: "현재 부하"

  LCfN_count_red: "§R[?current_ship_load|0]§!"
  LCfN_count_yellow: "§H[?current_ship_load|0]§!"
  LCfN_count_green: "§G[?current_ship_load|0]§!"

  LCfN_mob_breakdown_desc: "§H산업 동원:§!\n - 현재 소비재: [?current_cg_total|%Y]\n - 물류 효율성: [?econ_efficiency_factor|%G]\n\n§L소비재 수요가 높으면 해군 물류의 효율성이 저하됩니다. 경제를 동원하여 공업 역량을 최대한 활용하십시오.§!\n\n"
  LCfN_mob_disabled_desc: ""

  LCfN_upkeep_desc: "§H인프라 유지 관리:§!\n - 부하 요인: [?infra_strain|H2]\n\n§L조선소의 방대한 규모는 물류 마찰을 유발합니다. 효율성 보너스는 인프라 유지를 시뮬레이션하기 위해 이 요인으로 나뉩니다.§!\n\n"
  LCfN_upkeep_none: ""

  LCfN_linear_desc: "§L이 시스템은 선형 곡선을 사용합니다. 효율성이 일정한 속도로 변경됩니다. 한도를 초과하는 모든 선박은 동일한 페널티를 추가하여 예측 가능하고 안정적인 경험을 제공합니다.§!"
  LCfN_quadratic_desc: "§L이 시스템은 이차 곡선을 사용합니다. 페널티는 처음에는 작지만 한도를 초과하면 급격히 가속됩니다. 페널티 상승에는 제한이 없습니다.§!"
  LCfN_sigmoid_desc: "§L이 시스템은 시그모이드(S-곡선)를 사용합니다. 경미한 초과에는 부드럽게 시작되지만 중간에서 급격히 증가하며 조선소 수에 따른 공업적 한계에 도달합니다.§!"
  LCfN_logarithmic_desc: "§L이 시스템은 로그 곡선을 사용합니다. 초기의 한도 초과는 효율성에 큰 영향을 미치지만, 함대가 계속 성장함에 따라 페널티 증가세는 눈에 띄게 둔화됩니다.§!"
  LCfN_step_desc: "§L이 시스템은 고정된 임계값을 사용합니다. 부드러운 곡선 대신 특정 마일스톤에서 효율성이 갑자기 크게 떨어집니다.§!"
  LCfN_hyperbolic_desc: "§L이 시스템은 쌍곡선형 '죽음의 소용돌이'를 사용합니다. 임계 버퍼에 도달하기 전까지는 페널티를 관리할 수 있으나, 그 지점을 넘으면 물류가 완전히 붕괴됩니다.§!"

  LCfN_FORMULA_RULE: "해군 물류 스케일링"
  LCfN_RULE_LINEAR: "선형 (일관적)"
  LCfN_RULE_LINEAR_DESC: "§L선형 곡선을 사용합니다. 효율성이 일정한 속도로 변경되며, 한도 초과 선박당 페널티가 동일합니다.\n\n§H예시 (한도 C=240, 제수 K=100):§!\n차이 (D) = C - S\n공식: D / K\n\n§G40척 (D=200):§! 200 / 100 = §G+200%§!\n§G200척 (D=40):§! 40 / 100 = §G+40%§!\n§R280척 (D=-40):§! -40 / 100 = §R-40%§!§!"
  LCfN_RULE_QUADRATIC: "이차 (가속)"
  LCfN_RULE_QUADRATIC_DESC: "§L이차 곡선을 사용합니다. 한도를 초과함에 따라 페널티가 급격히 가속됩니다.\n\n§H예시 (한도 C=240, 제수 K=5000):§!\n공식: (D * D) / K\n\n§G40척 (D=200):§! (200^2) / 5000 = §G+800%§!\n§G200척 (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280척 (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_SIGMOID: "시그모이드 (균형)"
  LCfN_RULE_SIGMOID_DESC: "§LS-곡선을 사용합니다. 부드러운 시작, 중간의 급격한 변화, 조선소 기반 공업 한계가 특징입니다.\n\n§H예시 (한도 C=240, 제수 K=5000):§!\n공식: (D * D) / K\n제한: 조선소 (20) * 0.2 = §Y+/-400% 제한§!\n\n§G40척 (D=200):§! (200^2) / 5000 = §G+400%§! (제한 도달)\n§G200척 (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280척 (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_LOGARITHMIC: "로그 (초기 영향)"
  LCfN_RULE_LOGARITHMIC_DESC: "§L로그 곡선을 사용합니다. 초기의 한도 초과는 영향이 크지만 이후 페널티 증가율은 감소합니다.\n\n§H예시 (한도 C=240, 최대 M=5.0):§!\n공식: (M * D) / (D + 100)\n\n§G40척 (D=200):§! (5 * 200) / 300 = §G+333%§!\n§G200척 (D=40):§! (5 * 40) / 140 = §G+142%§!\n§R280척 (D=-40):§! (5 * -40) / 140 = §R-142%§!§!"
  LCfN_RULE_STEP: "단계 함수 (마일스톤)"
  LCfN_RULE_STEP_DESC: "§L고정된 임계값을 사용합니다. 특정 마일스톤에 도달하면 효율성이 단계적으로 급격히 감소합니다.\n\n§H예시 (한도 C=240):§!\n임계값: 초과 1, 50, 100 척\n\n§G40척 (미만):§! 기본 보너스 §G+10%§!\n§G200척 (미만):§! 기본 보너스 §G+10%§!\n§R280척 (40초과):§! 임계값 1 도달. 페널티: §R-25%§!§!"
  LCfN_RULE_HYPERBOLIC: "쌍곡선 (치명적)"
  LCfN_RULE_HYPERBOLIC_DESC: "§L'죽음의 소용돌이'를 사용합니다. 임계 지점에 가까워지면 물류가 완전히 붕괴되고 효율성이 0으로 급락합니다.\n\n§H예시 (한도 C=240, 버퍼 B=100):§!\n초과 공식: 1 / (B - Over_Amount)\n\n§G40척 (미만):§! 선형 보너스 §G+200%§!\n§G200척 (미만):§! 선형 보너스 §G+40%§!\n§R280척 (40초과):§! 1 / (100 - 40) = §R-1.7%§! (95척 초과 시 -20%로 급증)§!"

  LCfN_RULE_CLAMP: "물류 안전 클램프"
  LCfN_RULE_CLAMP_ON: "활성화 (권장)"
  LCfN_RULE_CLAMP_ON_DESC: "해군 생산 페널티가 -100%를 초과하지 않도록 방지합니다. 이를 통해 함대가 과도하게 확장되더라도 매우 느리게나마 수리 및 건조가 가능합니다."
  LCfN_RULE_CLAMP_OFF: "비활성화"
  LCfN_RULE_CLAMP_OFF_DESC: "안전 하한선을 제거합니다. 극단적인 초과는 -100%를 훨씬 넘는 페널티를 유발하여 해군 공업 출력을 사실상 정지시킵니다."
  LCfN_RULE_UNCLAMPED_PENALTY: "하드 모드: 과부하 집중"
  LCfN_RULE_UNCLAMPED_PENALTY_DESC: "한도 미만일 때의 모든 보너스를 제거합니다. 초과 페널티는 무제한이 됩니다. 경제 붕괴 방지를 위해 조선소 수에 비례한 최소한의 수송선만 제공됩니다."

  LCfN_RULE_MOBILIZATION: "경제 동원 영향"
  LCfN_RULE_MOB_ON: "활성화"
  LCfN_RULE_MOB_ON_DESC: "해군 물류 효율성이 소비재 사용량과 연동됩니다. 민간 경제는 효율성이 낮아지며, 전시 경제는 완전한 지원을 제공합니다."
  LCfN_RULE_MOB_OFF: "비활성화"
  LCfN_RULE_MOB_OFF_DESC: "경제법이나 소비재 요구 사항에 관계없이 산업이 100% 물류 지원을 제공합니다."

  LCfN_RULE_WEIGHTING: "함선 가중치"
  LCfN_RULE_WEIGHT_OFF: "균일 (1척 = 1용량)"
  LCfN_RULE_WEIGHT_OFF_DESC: "크기에 관계없이 모든 함선이 정확히 1단위의 해군 용량을 소비합니다."
  LCfN_RULE_WEIGHT_ON: "가중치 (선체 기반)"
  LCfN_RULE_WEIGHT_ON_DESC: "대형 함선이 더 많은 용량을 소비합니다. 구축함/잠수함: 1, 순양함: 2, 주력함: 4+."

  LCfN_RULE_SCALING_LOGIC: "스케일링 계산"
  LCfN_RULE_DISTANCE: "절대 거리"
  LCfN_RULE_DISTANCE_DESC: "물류가 한도를 초과하거나 미달하는 함선의 원시 수치를 기준으로 합니다."
  LCfN_RULE_PERCENT: "포화도 백분율"
  LCfN_RULE_PERCENT_DESC: "물류가 사용된 용량의 백분율을 기준으로 합니다. 소국에 유리합니다."

  LCfN_RULE_STRAIN: "인프라 유지 관리"
  LCfN_RULE_STRAIN_ON: "활성화"
  LCfN_RULE_STRAIN_ON_DESC: "많은 수의 조선소는 복잡성으로 인해 효율성이 감소하는 한계 수확 체감에 직면합니다."
  LCfN_RULE_STRAIN_OFF: "비활성화"
  LCfN_RULE_STRAIN_OFF_DESC: "조선소가 기본적인 물류 부담을 생성하지 않습니다."
