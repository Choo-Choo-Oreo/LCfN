l_polish:
  LCfN_naval_count_loc: "[LCfN_naval_count_loc]/[?calculated_naval_cap|H0]"
  LCfN_naval_capacity_dynamic_modifier: "Morskie Moce Przerobowe"
  LCfN_naval_label: "§HMorskie Moce Przerobowe§!"
  LCfN_naval_desc: "Twoja flota jest wspierana przez łączną produkcję stoczni i fabryk. Przekroczenie tego limitu obciąża logistykę morską.\n\n[LCfN_load_type_loc]: [LCfN_naval_count_loc]/[?calculated_naval_cap|H0]\n\n§HPodział Przemysłowy:§!\n - Stocznie (x[?doc_weight_value|H1]): [?num_of_naval_factories|G0] (Wartość: [?nav_dockyards|H0])\n - Fabryki Wojskowe (x[?mil_weight_value|H1]): [?num_of_military_factories|G0] (Wartość: [?mil_factories|H0])\n - Fabryki Cywilne (x[?civ_weight_value|H1]): [?num_of_civilian_factories|G0] (Wartość: [?civ_factories|H0])\n\n[LCfN_mobilization_loc][LCfN_upkeep_loc]§HAktualny Modyfikator:§!\n [?LCfN_icd_ncd_value|=%+1] Produkcja w Stoczniach\n\n[LCfN_formula_loc]\n\n§GKliknij ten wskaźnik, aby natychmiast odświeżyć status logistyczny.§!"

  LCfN_load_weighted: "§HPodział Floty:§!\n - $battle_cruiser$ (x[?bc_weight_value|H1]): [?num_ships_with_type@battle_cruiser|G0] (Wartość: [?t_bc|H0])\n - $battleship$ (x[?bb_weight_value|H1]): [?num_ships_with_type@battleship|G0] (Wartość: [?t_bb|H0])\n - $carrier$ (x[?cv_weight_value|H1]): [?num_ships_with_type@carrier|G0] (Wartość: [?t_cv|H0])\n - $destroyer$ (x[?dd_weight_value|H1]): [?num_ships_with_type@destroyer|G0] (Wartość: [?t_dd|H0])\n - $heavy_cruiser$ (x[?ca_weight_value|H1]): [?num_ships_with_type@heavy_cruiser|G0] (Wartość: [?t_ca|H0])\n - $light_cruiser$ (x[?cl_weight_value|H1]): [?num_ships_with_type@light_cruiser|G0] (Wartość: [?t_cl|H0])\n - $submarine$ (x[?ss_weight_value|H1]): [?num_ships_with_type@submarine|G0] (Wartość: [?t_ss|H0])\n - Inne (x§H1.0§!): [?t_misc|G0]\n\nCałkowite Obciążenie"
  LCfN_load_standard: "Aktualne Obciążenie"

  LCfN_count_red: "§R[?current_ship_load|0]§!"
  LCfN_count_yellow: "§H[?current_ship_load|0]§!"
  LCfN_count_green: "§G[?current_ship_load|0]§!"

  LCfN_mob_breakdown_desc: "§HMobilizacja Przemysłowa:§!\n - Dobra Konsumpcyjne: [?current_cg_total|%Y]\n - Wydajność Logistyczna: [?econ_efficiency_factor|%G]\n\n§LWysoki popyt na dobra konsumpcyjne obniża wydajność logistyki morskiej. Zmobilizuj gospodarkę, aby wykorzystać pełny potencjał.§!\n\n"
  LCfN_mob_disabled_desc: ""

  LCfN_upkeep_desc: "§HUtrzymanie Infrastruktury:§!\n - Współczynnik Obciążenia: [?infra_strain|H2]\n\n§LOgromna skala Twoich stoczni tworzy tarcie logistyczne. Bonus do wydajności jest dzielony przez ten współczynnik.§!\n\n"
  LCfN_upkeep_none: ""

  LCfN_linear_desc: "§LSystem używa krzywej Liniowej. Wydajność zmienia się w stałym tempie. Każdy okręt powyżej limitu dodaje taką samą karę.§!"
  LCfN_quadratic_desc: "§LSystem używa krzywej Kwadratowej. Kary rosną gwałtownie wraz z przekroczeniem limitu. Brak górnej granicy kary.§!"
  LCfN_sigmoid_desc: "§LSystem używa Sigmoidy (S-krzywa). Łagodny start przy małym przekroczeniu, ale gwałtowny wzrost w środku skali.§!"
  LCfN_logarithmic_desc: "§LSystem używa krzywej Logarytmicznej. Pierwsze okręty nad limitem mają duży wpływ, ale wzrost kary z czasem zwalnia.§!"
  LCfN_step_desc: "§LSystem używa stałych progów. Wydajność spada skokowo przy określonych kamieniach milowych.§!"
  LCfN_hyperbolic_desc: "§LSystem używa 'Spirali Śmierci'. Kary są znośne do momentu zbliżenia się do krytycznego bufora, gdzie logistyka całkowicie upada.§!"

  LCfN_FORMULA_RULE: "Skalowanie Logistyki Morskiej"
  LCfN_RULE_LINEAR: "Liniowe (Stałe)"
  LCfN_RULE_LINEAR_DESC: "§LSystem używa krzywej Liniowej. Wydajność zmienia się w stałym tempie.\n\n§HPrzykład (Limit C=240, Dzielnik K=100):§!\nDiff (D) = C - S\nFormuła: D / K\n\n§G40 Okrętów (D=200):§! 200 / 100 = §G+200%§!\n§G200 Okrętów (D=40):§! 40 / 100 = §G+40%§!\n§R280 Okrętów (D=-40):§! -40 / 100 = §R-40%§!§!"
  LCfN_RULE_QUADRATIC: "Kwadratowe (Skalowane)"
  LCfN_RULE_QUADRATIC_DESC: "§LSystem używa krzywej Kwadratowej. Kary rosną gwałtownie po przekroczeniu limitu.\n\n§HPrzykład (Limit C=240, Dzielnik K=5000):§!\nFormuła: (D * D) / K\n\n§G40 Okrętów (D=200):§! (200^2) / 5000 = §G+800%§!\n§G200 Okrętów (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280 Okrętów (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_SIGMOID: "Sigmoidalne (Zbalansowane)"
  LCfN_RULE_SIGMOID_DESC: "§LSystem używa S-krzywej. Gwałtowny wzrost w środku przed osiągnięciem sufitu przemysłowego.\n\n§HPrzykład (Limit C=240, Dzielnik K=5000):§!\nFormuła: (D * D) / K\nLimit: Stocznie (20) * 0.2 = §Y+/-400% Limit§!\n\n§G40 Okrętów (D=200):§! (200^2) / 5000 = §G+400%§! (Limit)\n§G200 Okrętów (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280 Okrętów (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_LOGARITHMIC: "Logarytmiczne (Wczesny Wpływ)"
  LCfN_RULE_LOGARITHMIC_DESC: "§LSystem używa krzywej Logarytmicznej. Duży wpływ na początku, ale tempo wzrostu kary maleje.\n\n§HPrzykład (Limit C=240, Max M=5.0):§!\nFormuła: (M * D) / (D + 100)\n\n§G40 Okrętów (D=200):§! (5 * 200) / 300 = §G+333%§!\n§G200 Okrętów (D=40):§! (5 * 40) / 140 = §G+142%§!\n§R280 Okrętów (D=-40):§! (5 * -40) / 140 = §R-142%§!§!"
  LCfN_RULE_STEP: "Funkcja Schodkowa (Kamienie Milowe)"
  LCfN_RULE_STEP_DESC: "§LSystem używa stałych progów. Wydajność spada skokowo przy przekroczeniu konkretnych wartości.\n\n§HPrzykład (Limit C=240):§!\nProgi: 1, 50, 100 okrętów nad limit\n\n§G40 Okrętów (Poniżej):§! Bonus Bazowy §G+10%§!\n§G200 Okrętów (Poniżej):§! Bonus Bazowy §G+10%§!\n§R280 Okrętów (40 Nad):§! Przekroczenie Progu 1. Kara: §R-25%§!§!"
  LCfN_RULE_HYPERBOLIC: "Hiperboliczne (Krytyczne)"
  LCfN_RULE_HYPERBOLIC_DESC: "§LSystem 'Spirali Śmierci'. Kary stają się ekstremalne przy zbliżaniu się do krytycznego punktu.\n\n§HPrzykład (Limit C=240, Bufor B=100):§!\nFormuła nad Limitem: 1 / (B - Liczba_Nad)\n\n§G40 Okrętów (Poniżej):§! Bonus Liniowy §G+200%§!\n§G200 Okrętów (Poniżej):§! Bonus Liniowy §G+40%§!\n§R280 Okrętów (40 Nad):§! 1 / (100 - 40) = §R-1.7%§! (Uwaga: Przy 95 Nad, rośnie do -20%)§!"

  LCfN_RULE_CLAMP: "Logistyczny Hamulec Bezpieczeństwa"
  LCfN_RULE_CLAMP_ON: "Włączony (Zalecane)"
  LCfN_RULE_CLAMP_ON_DESC: "Zapobiega spadkowi wydajności poniżej -100%. Dzięki temu flota zawsze może być naprawiana, choć bardzo powoli."
  LCfN_RULE_CLAMP_OFF: "Wyłączony"
  LCfN_RULE_CLAMP_OFF_DESC: "Usuwa dolny limit kary. Skrajne przekroczenie może całkowicie zatrzymać produkcję morską."
  LCfN_RULE_UNCLAMPED_PENALTY: "Tryb Trudny: Skupienie na Przekroczeniu"
  LCfN_RULE_UNCLAMPED_PENALTY_DESC: "Usuwa bonusy za bycie poniżej limitu. Kary za przekroczenie są teraz nieograniczone."

  LCfN_RULE_MOBILIZATION: "Wpływ Mobilizacji Gospodarczej"
  LCfN_RULE_MOB_ON: "Włączone"
  LCfN_RULE_MOB_ON_DESC: "Wydajność morska jest powiązana z dobrami konsumpcyjnymi. Gospodarka cywilna oferuje mniejszą wydajność niż wojenna."
  LCfN_RULE_MOB_OFF: "Wyłączone"
  LCfN_RULE_MOB_OFF_DESC: "Przemysł zapewnia 100% wsparcia niezależnie od prawa gospodarczego."

  LCfN_RULE_WEIGHTING: "Waga Okrętów"
  LCfN_RULE_WEIGHT_OFF: "Jednolita (1 Okręt = 1 Cap)"
  LCfN_RULE_WEIGHT_OFF_DESC: "Każdy okręt zużywa dokładnie 1 jednostkę morskich mocy."
  LCfN_RULE_WEIGHT_ON: "Ważona (Zależna od Kadłuba)"
  LCfN_RULE_WEIGHT_ON_DESC: "Większe okręty zużywają więcej mocy. Niszczyciele/Okręty Podwodne: 1, Krążowniki: 2, Pancerniki+: 4+."

  LCfN_RULE_SCALING_LOGIC: "Logika Skalowania"
  LCfN_RULE_DISTANCE: "Odległość Bezwzględna"
  LCfN_RULE_DISTANCE_DESC: "Logistyka oparta na surowej liczbie okrętów nad/pod limitem."
  LCfN_RULE_PERCENT: "Procent Nasycenia"
  LCfN_RULE_PERCENT_DESC: "Logistyka oparta na procentowym wykorzystaniu limitu. Lepsze dla mniejszych państw."

  LCfN_RULE_STRAIN: "Utrzymanie Infrastruktury"
  LCfN_RULE_STRAIN_ON: "Włączone"
  LCfN_RULE_STRAIN_ON_DESC: "Duża liczba stoczni wiąże się z malejącymi korzyściami z powodu obciążenia logistycznego."
  LCfN_RULE_STRAIN_OFF: "Wyłączone"
  LCfN_RULE_STRAIN_OFF_DESC: "Stocznie nie generują bazowego obciążenia logistycznego."
