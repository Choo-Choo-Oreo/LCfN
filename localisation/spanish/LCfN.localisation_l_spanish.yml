l_spanish:
  LCfN_naval_count_loc: "[LCfN_naval_count_loc]/[?calculated_naval_cap|H0]"
  LCfN_naval_capacity_dynamic_modifier: "Capacidad Industrial Naval"
  LCfN_naval_label: "§HCapacidad Industrial Naval§!"
  LCfN_naval_desc: "Tu armada se apoya en la producción combinada de tus astilleros y fábricas. Exceder este límite sobrecarga tu logística marítima.\n\n[LCfN_load_type_loc]: [LCfN_naval_count_loc]/[?calculated_naval_cap|H0]\n\n§HDesglose Industrial:§!\n - Astilleros Navales (x[?doc_weight_value|H1]): [?num_of_naval_factories|G0] (Valor: [?nav_dockyards|H0])\n - Fábricas Militares (x[?mil_weight_value|H1]): [?num_of_military_factories|G0] (Valor: [?mil_factories|H0])\n - Fábricas Civiles (x[?civ_weight_value|H1]): [?num_of_civilian_factories|G0] (Valor: [?civ_factories|H0])\n\n[LCfN_mobilization_loc][LCfN_upkeep_loc]§HModificador Actual:§!\n [?LCfN_icd_ncd_value|=%+1] Producción de Astilleros\n\n[LCfN_formula_loc]\n\n§GHaz clic en este indicador para actualizar tu estado logístico de inmediato.§!"

  LCfN_load_weighted: "§HDesglose de Flota:§!\n - $battle_cruiser$ (x[?bc_weight_value|H1]): [?num_ships_with_type@battle_cruiser] (Valor: [?t_bc|H0])\n - $battleship$ (x[?bb_weight_value|H1]): [?num_ships_with_type@battleship] (Valor: [?t_bb|H0])\n - $carrier$ (x[?cv_weight_value|H1]): [?num_ships_with_type@carrier] (Valor: [?t_cv|H0])\n - $destroyer$ (x[?dd_weight_value|H1]): [?num_ships_with_type@destroyer] (Valor: [?t_dd|H0])\n - $heavy_cruiser$ (x[?ca_weight_value|H1]): [?num_ships_with_type@heavy_cruiser] (Valor: [?t_ca|H0])\n - $light_cruiser$ (x[?cl_weight_value|H1]): [?num_ships_with_type@light_cruiser] (Valor: [?t_cl|H0])\n - $submarine$ (x[?ss_weight_value|H1]): [?num_ships_with_type@submarine] (Valor: [?t_ss|H0])\n - Misceláneos (x§H1.0§!): [?t_misc|0]\n\nCarga Total"
  LCfN_load_standard: "Carga Actual"

  LCfN_count_red: "§R[?current_ship_load|0]§!"
  LCfN_count_yellow: "§H[?current_ship_load|0]§!"
  LCfN_count_green: "§G[?current_ship_load|0]§!"

  LCfN_mob_breakdown_desc: "§HMovilización Industrial:§!\n - Bienes de Consumo actuales: [?current_cg_total|%Y]\n - Eficiencia Logística: [?econ_efficiency_factor|%G]\n\n§LLa alta demanda de bienes de consumo reduce la eficiencia de tu logística naval. Moviliza tu economía para utilizar toda tu capacidad industrial.§!\n\n"
  LCfN_mob_disabled_desc: ""

  LCfN_upkeep_desc: "§HMantenimiento de Infraestructura:§!\n - Factor de Tensión: [?infra_strain|H2]\n\n§LLa escala masiva de tus astilleros crea fricción logística. Tu bonificación de eficiencia se divide por este factor para simular el mantenimiento de la infraestructura.§!\n\n"
  LCfN_upkeep_none: ""

  LCfN_linear_desc: "§LEste sistema usa una curva lineal. La eficiencia cambia a un ritmo constante. Cada barco por encima de tu capacidad añade la misma penalización, ofreciendo una experiencia estable.§!"
  LCfN_quadratic_desc: "§LEste sistema usa una curva cuadrática. Las penalizaciones comienzan pequeñas pero se aceleran rápidamente al exceder tu capacidad. No hay límite para la penalización.§!"
  LCfN_sigmoid_desc: "§LEste sistema usa una curva sigmoide (Curva S). Tiene un inicio suave, pero escala bruscamente en el medio antes de alcanzar un techo industrial basado en tus astilleros.§!"
  LCfN_logarithmic_desc: "§LEste sistema usa una curva logarítmica. Los primeros barcos sobre el límite tienen un gran impacto, pero el crecimiento de la penalización se ralentiza al aumentar la flota.§!"
  LCfN_step_desc: "§LEste sistema usa umbrales fijos. En lugar de una curva suave, la eficiencia cae en grandes 'escalones' en hitos específicos.§!"
  LCfN_hyperbolic_desc: "§LEste sistema usa una 'Espiral de Muerte' hiperbólica. Las penalizaciones son manejables hasta acercarse a un margen crítico, donde la logística colapsa totalmente.§!"

  LCfN_FORMULA_RULE: "Escalado de Logística Naval"
  LCfN_RULE_LINEAR: "Lineal (Consistente)"
  LCfN_RULE_LINEAR_DESC: "§LUtiliza una curva lineal. La eficiencia cambia a un ritmo constante. Cada barco sobre el límite añade la misma penalización.\n\n§HEjemplo (Cap C=240, Divisor K=100):§!\nDif (D) = C - S\nFórmula: D / K\n\n§G40 Barcos (D=200):§! 200 / 100 = §G+200%§!\n§G200 Barcos (D=40):§! 40 / 100 = §G+40%§!\n§R280 Barcos (D=-40):§! -40 / 100 = §R-40%§!§!"
  LCfN_RULE_QUADRATIC: "Cuadrática (Escalable)"
  LCfN_RULE_QUADRATIC_DESC: "§LUtiliza una curva cuadrática. Las penalizaciones se aceleran rápidamente al exceder la capacidad.\n\n§HEjemplo (Cap C=240, Divisor K=5000):§!\nFórmula: (D * D) / K\n\n§G40 Barcos (D=200):§! (200^2) / 5000 = §G+800%§!\n§G200 Barcos (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280 Barcos (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_SIGMOID: "Sigmoide (Equilibrada)"
  LCfN_RULE_SIGMOID_DESC: "§LUtiliza una curva S. Inicio suave, escalado brusco central y un tope industrial basado en astilleros.\n\n§HEjemplo (Cap C=240, Divisor K=5000):§!\nFórmula: (D * D) / K\nLímite: Astilleros (20) * 0.2 = §YLímite +/-400%§!\n\n§G40 Barcos (D=200):§! (200^2) / 5000 = §G+400%§! (Topado)\n§G200 Barcos (D=40):§! (40^2) / 5000 = §G+32%§!\n§R280 Barcos (D=-40):§! (-40^2) / 5000 = §R-32%§!§!"
  LCfN_RULE_LOGARITHMIC: "Logarítmica (Impacto Temprano)"
  LCfN_RULE_LOGARITHMIC_DESC: "§LUtiliza una curva logarítmica. Los primeros barcos sobre el límite impactan mucho, pero la penalización crece más lento después.\n\n§HEjemplo (Cap C=240, Máx M=5.0):§!\nFórmula: (M * D) / (D + 100)\n\n§G40 Barcos (D=200):§! (5 * 200) / 300 = §G+333%§!\n§G200 Barcos (D=40):§! (5 * 40) / 140 = §G+142%§!\n§R280 Barcos (D=-40):§! (5 * -40) / 140 = §R-142%§!§!"
  LCfN_RULE_STEP: "Función Escalonada (Hitos)"
  LCfN_RULE_STEP_DESC: "§LUtiliza umbrales fijos. La eficiencia cae en 'pasos' repentinos en hitos específicos.\n\n§HEjemplo (Cap C=240):§!\nUmbrales: 1, 50, 100 barcos sobre cap\n\n§G40 Barcos (Bajo):§! Bono Base §G+10%§!\n§G200 Barcos (Bajo):§! Bono Base §G+10%§!\n§R280 Barcos (40 Sobre):§! Supera Umbral 1. Penalización: §R-25%§!§!"
  LCfN_RULE_HYPERBOLIC: "Hiperbólica (Crítica)"
  LCfN_RULE_HYPERBOLIC_DESC: "§LUtiliza una 'Espiral de Muerte'. Las penalizaciones son leves hasta llegar a un buffer crítico, donde la logística colapsa.\n\n§HEjemplo (Cap C=240, Buffer B=100):§!\nFórmula Sobre Cap: 1 / (B - Over_Amount)\n\n§G40 Barcos (Bajo):§! Bono Lineal §G+200%§!\n§G200 Barcos (Bajo):§! Bono Lineal §G+40%§!\n§R280 Barcos (40 Sobre):§! 1 / (100 - 40) = §R-1.7%§! (Nota: A 95 sobre, sube a -20%)§!"

  LCfN_RULE_CLAMP: "Tope de Seguridad Logística"
  LCfN_RULE_CLAMP_ON: "Habilitado (Recomendado)"
  LCfN_RULE_CLAMP_ON_DESC: "Evita que las penalizaciones superen el -100%. Esto asegura que incluso flotas muy grandes puedan reparar barcos, aunque sea muy lento."
  LCfN_RULE_CLAMP_OFF: "Deshabilitado"
  LCfN_RULE_CLAMP_OFF_DESC: "Elimina el suelo de seguridad. El exceso extremo puede detener la producción naval por completo."
  LCfN_RULE_UNCLAMPED_PENALTY: "Modo Difícil: Foco en Sobrecapacidad"
  LCfN_RULE_UNCLAMPED_PENALTY_DESC: "Elimina bonos por estar bajo capacidad. Las penalizaciones por exceder el límite son masivas. Las naciones sobre el límite reciben un goteo de convoyes según sus astilleros."

  LCfN_RULE_MOBILIZATION: "Impacto de Movilización Económica"
  LCfN_RULE_MOB_ON: "Habilitado"
  LCfN_RULE_MOB_ON_DESC: "La eficiencia logística naval depende de los bienes de consumo. Las economías civiles tendrán eficiencia reducida."
  LCfN_RULE_MOB_OFF: "Deshabilitado"
  LCfN_RULE_MOB_OFF_DESC: "La industria proporciona 100% de apoyo logístico independientemente de la ley económica."

  LCfN_RULE_WEIGHTING: "Peso de Barcos"
  LCfN_RULE_WEIGHT_OFF: "Uniforme (1 Barco = 1 Cap)"
  LCfN_RULE_WEIGHT_OFF_DESC: "Cada barco consume exactamente 1 unidad de Capacidad Naval."
  LCfN_RULE_WEIGHT_ON: "Pesado (Basado en Casco)"
  LCfN_RULE_WEIGHT_ON_DESC: "Barcos grandes consumen más. Destructores/Subs: 1, Cruceros: 2, Capitales: 4+."

  LCfN_RULE_SCALING_LOGIC: "Lógica de Cálculo"
  LCfN_RULE_DISTANCE: "Distancia Absoluta"
  LCfN_RULE_DISTANCE_DESC: "La logística se basa en el número bruto de barcos sobre o bajo el límite."
  LCfN_RULE_PERCENT: "Porcentaje de Saturación"
  LCfN_RULE_PERCENT_DESC: "La logística se basa en el porcentaje de capacidad usada. Mejor para naciones pequeñas."

  LCfN_RULE_STRAIN: "Mantenimiento de Infraestructura"
  LCfN_RULE_STRAIN_ON: "Habilitado"
  LCfN_RULE_STRAIN_ON_DESC: "Tener muchos astilleros provoca rendimientos decrecientes debido a la complejidad logística."
  LCfN_RULE_STRAIN_OFF: "Deshabilitado"
  LCfN_RULE_STRAIN_OFF_DESC: "Los astilleros no crean tensión logística base."
